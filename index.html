<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CNC AI Recognizer</title>

<style>
body{
    margin:0;
    padding:0;
    background:#050505;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
}

.wrap{
    max-width:700px;
    margin:0 auto;
    padding:24px;
}

.card{
    background:#111;
    border-radius:24px;
    padding:24px;
    margin-bottom:24px;
}

h1{
    font-size:58px;
    line-height:0.95;
    margin:0 0 20px 0;
    font-weight:900;
}

.sub{
    font-size:22px;
    color:#cfcfcf;
    margin-bottom:28px;
}

input[type=file]{
    width:100%;
    background:#1b1b1b;
    color:white;
    border:none;
    border-radius:18px;
    padding:18px;
    font-size:18px;
    margin-bottom:22px;
}

button{
    width:100%;
    border:none;
    border-radius:22px;
    padding:26px;
    font-size:34px;
    font-weight:800;
    background:#00d86a;
    color:white;
    cursor:pointer;
}

button:active{
    transform:scale(.99);
}

h2{
    font-size:54px;
    margin:0 0 20px 0;
}

.result{
    background:black;
    border-radius:20px;
    padding:22px;
    font-size:18px;
    white-space:pre-wrap;
    word-break:break-word;
}

.status{
    margin-top:16px;
    font-size:22px;
    color:#cccccc;
}
</style>
</head>

<body>

<div class="wrap">

<div class="card">
<h1>CNC AI<br>Recognizer</h1>

<div class="sub">
Datei, Bild, Galerie oder Kamera nutzen
</div>

<input
type="file"
id="fileInput"
accept="image/*,.pdf"
>

<button onclick="uploadFile()">
Analyse starten
</button>

<div class="status" id="status">
Noch keine Datei gewählt.
</div>
</div>

<div class="card">
<h2>Ergebnis</h2>
<div class="result" id="result">
Noch keine Analyse gestartet.
</div>
</div>

</div>

<script>
const fileInput = document.getElementById("fileInput");
const statusBox = document.getElementById("status");
const resultBox = document.getElementById("result");

fileInput.addEventListener("change", () => {
    if(fileInput.files.length > 0){
        statusBox.innerText = "Datei gewählt: " + fileInput.files[0].name;
    }else{
        statusBox.innerText = "Noch keine Datei gewählt.";
    }
});

async function uploadFile(){

    if(fileInput.files.length === 0){
        statusBox.innerText = "Bitte zuerst Datei wählen.";
        return;
    }

    const file = fileInput.files[0];

    statusBox.innerText = "Analyse läuft...";

    const formData = new FormData();
    formData.append("file", file);

    try{

        const response = await fetch("/api/recognize", {
            method:"POST",
            body:formData
        });

        const text = await response.text();

        try{
            const json = JSON.parse(text);
            resultBox.innerText = JSON.stringify(json,null,2);
        }catch{
            resultBox.innerText = text;
        }

        statusBox.innerText = "Fertig.";

    }catch(error){

        statusBox.innerText = "Fehler.";
        resultBox.innerText = error;

    }
}
</script>

</body>
</html>
